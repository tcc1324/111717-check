<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>网络体检 · 给聆遇的游乐园</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;padding:22px 16px 40px;font:15px/1.75 -apple-system,'Noto Sans SC','PingFang SC',system-ui,sans-serif;
       background:#f7f3ea;color:#3f3a33}
  h1{font-size:19px;letter-spacing:.06em;margin:0 0 4px;font-weight:600}
  .sub{font-size:12.5px;color:#93897a;margin-bottom:18px}
  .card{background:#fffdf8;border:1px solid #e8dfcd;border-radius:14px;padding:6px 2px;margin-bottom:16px;
        box-shadow:0 1px 0 rgba(120,100,70,.04)}
  .row{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid #f1e9db}
  .row:last-child{border-bottom:0}
  .dot{flex:0 0 9px;height:9px;margin-top:8px;border-radius:50%;background:#cfc6b6}
  .ok .dot{background:#5f9e6a}
  .bad .dot{background:#c2604a}
  .wait .dot{background:#cfae74}
  .body{flex:1;min-width:0}
  .name{font-size:14.5px}
  .meta{font-size:12.5px;color:#948a7b;word-break:break-word;margin-top:2px}
  .right{font-size:12.5px;color:#8d8375;white-space:nowrap;padding-top:2px}
  .verdict{background:#fff8ec;border:1px solid #ecdcc0;border-radius:14px;padding:14px 16px;font-size:14px;margin-bottom:16px}
  .verdict b{font-weight:600}
  button{appearance:none;border:0;border-radius:11px;padding:11px 16px;font:inherit;letter-spacing:.08em;
         background:#c8a97e;color:#fffdf8;cursor:pointer}
  button:active{transform:translateY(1px)}
  button[disabled]{opacity:.55}
  .tip{font-size:12px;color:#a29685;margin-top:10px;line-height:1.7}
  @media (prefers-color-scheme:dark){
    body{background:#191714;color:#e6ddd0}
    .card{background:#211e1a;border-color:#332e27;box-shadow:none}
    .row{border-bottom-color:#2b2722}
    .meta,.right{color:#9c9080}
    .verdict{background:#241f19;border-color:#3a3228}
    h1{color:#f0e7d8}
  }
</style>
</head>
<body>
<h1>网络体检</h1>
<div class="sub">在打不开网站的那条 WiFi 下打开这一页，看哪一路不通。</div>

<div id="verdict" class="verdict">正在测…（大概十几秒）</div>

<div class="card" id="rows">
  <div class="row wait"><div class="dot"></div><div class="body"><div class="name">网站首页 · github.io</div><div class="meta">页面本体能不能打开</div></div><div class="right">…</div></div>
  <div class="row wait"><div class="dot"></div><div class="body"><div class="name">Supabase 数据库</div><div class="meta">读表用的接口，内容全从这里来</div></div><div class="right">…</div></div>
  <div class="row wait"><div class="dot"></div><div class="body"><div class="name">Supabase 静态资源</div><div class="meta">字体、脚本、图片的存放处</div></div><div class="right">…</div></div>
  <div class="row wait"><div class="dot"></div><div class="body"><div class="name">腾讯云函数</div><div class="meta">音乐小屋那条路，也是以后要用的通道</div></div><div class="right">…</div></div>
</div>

<button id="again">重新测一次</button>
<div class="tip">这一页只在你的屏幕上显示结果，不上报、不写数据库、不采集任何信息。测完把这一屏截图发出去就行。</div>

<script>
(function () {
  'use strict';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2dXZuY3hkeXhzZ2lxdXJrb3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTg4MzEsImV4cCI6MjEwNjQ5NDgzMX0.t94gMYY277tAPHo65HIctRbIRiMog-JO3Yv8tAa66aA';
  var SB = 'https://zvuvncxdyxsgiqurkork.supabase.co';
  var GH = 'https://tcc1324.github.io/111717/';
  var STORAGE = SB + '/storage/v1/object/public/static/js/common.js?v=2026100802';

  function timeout(ms) {
    var c = new AbortController();
    setTimeout(function () { c.abort(); }, ms);
    return c.signal;
  }

  function ms(t) { return Math.round(performance.now() - t) + ' ms'; }

  async function run(name, label, fn) {
    var t = performance.now();
    try {
      var info = await fn();
      return { name: name, label: label, ok: true, ms: Math.round(performance.now() - t), info: info || '' };
    } catch (e) {
      var m = (e && (e.name + ': ' + (e.message || ''))) || String(e);
      if (e && e.name === 'AbortError') m = '超时（12 秒没有回应）';
      return { name: name, label: label, ok: false, ms: Math.round(performance.now() - t), info: m };
    }
  }

  var tests = [
    run('网站首页 · github.io', '页面本体', async function () {
      await fetch(GH, { mode: 'no-cors', cache: 'no-store', signal: timeout(12000) });
      return '拿到了（跨域看不到状态码，正常）';
    }),
    run('Supabase 数据库', 'rest/v1', async function () {
      var r = await fetch(SB + '/rest/v1/mw_events?select=id&limit=1', {
        headers: { apikey: ANON, Authorization: 'Bearer ' + ANON },
        cache: 'no-store', signal: timeout(12000)
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      await r.text();
      return 'HTTP ' + r.status;
    }),
    run('Supabase 静态资源', 'storage', async function () {
      var r = await fetch(STORAGE, { cache: 'no-store', signal: timeout(12000) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var t = await r.text();
      return 'HTTP ' + r.status + ' · ' + t.length + ' 字节';
    }),
    run('腾讯云函数', '本页所在通道', async function () {
      var r = await fetch('https://1512583080-b5n0wu74e1.ap-guangzhou.tencentscf.com/api/ping', { cache: 'no-store', signal: timeout(12000) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var j = await r.json();
      return 'HTTP ' + r.status + ' · cookie ' + (j.cookie ? '有' : '无');
    })
  ];

  function paint(results) {
    var box = document.getElementById('rows');
    box.innerHTML = '';
    results.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'row ' + (r.ok ? 'ok' : 'bad');
      var dot = document.createElement('div'); dot.className = 'dot';
      var body = document.createElement('div'); body.className = 'body';
      var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = r.name;
      var meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = r.ok ? r.info : r.info;
      body.appendChild(nm); body.appendChild(meta);
      var right = document.createElement('div'); right.className = 'right';
      right.textContent = r.ok ? r.ms + ' ms' : '✕';
      row.appendChild(dot); row.appendChild(body); row.appendChild(right);
      box.appendChild(row);
    });
  }

  function verdict(results) {
    var gh = results[0], db = results[1], st = results[2], scf = results[3];
    var box = document.getElementById('verdict');
    if (gh.ok && db.ok && st.ok) {
      box.innerHTML = '<b>这一路全是通的。</b>说明现在这个网络没问题，问题可能出现在别的时间段（比如晚上高峰），下次卡住时再点一次。<br><span class="meta">' +
        (scf.ok ? '腾讯云函数也通。' : '只有腾讯云函数不通，记一下这条。') + '</span>';
    } else if (gh.ok && !db.ok) {
      box.innerHTML = '<b>找到了：网站能开，但 Supabase 连不上。</b>这就是「页面转圈、内容不出来」的原因，和账号密码无关，是这条路被拦了。' +
        (st.ok ? '<br><span class="meta">静态资源那条路是通的，只有数据库接口不通。</span>' : '<br><span class="meta">数据库和静态资源都不通，整条 Supabase 被挡。</span>');
    } else if (!gh.ok) {
      box.innerHTML = '<b>连网站首页都打不开。</b>这不是数据库的问题，是 GitHub Pages 那条路不通。<br><span class="meta">先确认这条 WiFi 能不能打开别的网站；如果别的都好，那就是 github.io 被挡。</span>';
    } else {
      box.innerHTML = '<b>部分不通。</b>把这屏发给做网站的人看，按上面的红点逐条排查。';
    }
  }

  async function all() {
    var btn = document.getElementById('again');
    btn.disabled = true;
    document.getElementById('verdict').textContent = '正在测…（大概十几秒）';
    var results = await Promise.all(tests);
    paint(results);
    verdict(results);
    btn.disabled = false;
    btn.textContent = '重新测一次';
  }

  document.getElementById('again').addEventListener('click', all);
  all();
})();
</script>
</body>
</html>
